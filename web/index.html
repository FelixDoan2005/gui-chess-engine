<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Felis</title>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <style>
    body { background: #1e1e1e; color: white; font-family: Arial, sans-serif; text-align: center; }
    #board { width: min(90vw, 75vh); margin: 20px auto; }
    #controls { margin: 10px; }
    #controls select, #controls button { font-size: 16px; padding: 6px 10px; margin: 0 4px; }
    #promotion { display: none; margin: 10px; }
    #promotion img { width: 60px; cursor: pointer; background: #3c3c3c; border-radius: 8px; margin: 0 4px; }
    .last-move { box-shadow: inset 0 0 0 100px rgba(80, 200, 80, 0.43); }
    .legal-move { background-image: radial-gradient(circle, rgba(20, 20, 20, 0.5) 20%, transparent 20%); }
    .clock { display: none; font-size: 22px; padding: 4px 14px; border-radius: 8px; background: #5a5a5a; width: fit-content; margin: 0 auto; }
    .clock.running { background: #3c783c; }
  </style>
</head>
<body>
  <h1>Felis</h1> <!-- need to do elo eval for cloud version-->
  <div id="controls">
    <select id="colour">
      <option value="w">Play as White</option>
      <option value="b">Play as Black</option>
    </select>
    <select id="seconds">
      <option value="1">1 second per move (~1838 Elo)</option>
      <option value="3">3 seconds per move (~1996 Elo)</option>
      <option value="5">5 seconds per move (~1935 Elo)</option>
    </select>
    <select id="clock">
      <option value="0">No clock</option>
      <option value="3">3 minutes</option>
      <option value="5">5 minutes</option>
      <option value="10">10 minutes</option>
    </select>
    <button id="new-game">New game</button>
  </div>
  <div id="felis-clock" class="clock"></div>
  <div id="board"></div>
  <div id="your-clock" class="clock"></div>
  <div id="promotion"></div>
  <p id="status">Pick your colour and time, then press New game</p>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script>
    const PIECE_NAMES = {P: "pawn", N: "knight", B: "bishop", R: "rook", Q: "queen", K: "king"};
    const PROMOTION_PIECES = ["q", "r", "b", "n"];

    let game = new Chess();
    let moves = [];
    let thinking = false;
    let playerColour = "w";
    let seconds = 1;
    let gameNumber = 0;
    let promotionMove = null;
    let selectedSquare = null;
    let clocks = null;        // milliseconds left, e.g. {w: 180000, b: 180000}, null = no clock
    let clockSide = "w";      // whose clock is running
    let clockStart = 0;       // when it started running
    let clockRunning = false;
    let outOfTime = false;
    const status = document.getElementById("status");
    const promotion = document.getElementById("promotion");

    // chessboard.js calls pieces "wP", "bK"...: use your own pictures, e.g. white_pawn.png
    function pieceImage(piece) {
      let colour = "black";
      if (piece[0] === "w") {
        colour = "white";
      }
      return "/pieces/" + colour + "_" + PIECE_NAMES[piece[1]] + ".png";
    }

    function newGame() {
      gameNumber += 1;
      game = new Chess();
      moves = [];
      thinking = false;
      promotionMove = null;
      promotion.style.display = "none";
      playerColour = document.getElementById("colour").value;
      seconds = Number(document.getElementById("seconds").value);

      const clockMinutes = Number(document.getElementById("clock").value);
      outOfTime = false;
      if (clockMinutes === 0) {
        clocks = null;
        clockRunning = false;
      } else {
        clocks = {w: clockMinutes * 60000, b: clockMinutes * 60000};
        clockSide = "w";
        clockStart = Date.now();
        clockRunning = true;
      }
      updateClocks();

      if (playerColour === "w") {
        board.orientation("white");
      } else {
        board.orientation("black");
      }
      board.start();
      highlightLastMove(null);
      clearLegalMoves();

      if (playerColour === "w") {
        status.textContent = "Your move";
      } else {
        askFelis();
      }
    }

    function onDragStart(square, piece) {
      if (thinking || outOfTime || promotionMove !== null || game.game_over() || piece[0] !== playerColour) {
        return false;
      }
      showLegalMoves(square);
    }

    function tryMove(fromSquare, toSquare) {
      clearLegalMoves();
      // a pawn reaching the last rank: ask which piece first
      const legalMoves = game.moves({square: fromSquare, verbose: true});
      for (const legalMove of legalMoves) {
        if (legalMove.to === toSquare && legalMove.flags.includes("p")) {
          promotionMove = {from: fromSquare, to: toSquare};
          showPromotionPicker();
          return;
        }
      }

      const move = game.move({from: fromSquare, to: toSquare});
      if (move === null) {
        return "snapback";
      }
      playerMoved(fromSquare + toSquare);
    }

    function onDrop(fromSquare, toSquare) {
      if (fromSquare === toSquare) {
        return "snapback";
      }
      return tryMove(fromSquare, toSquare);
    }


    // redraw after castling, en passant or promotion
    function onSnapEnd() {
      board.position(game.fen());
    }

    function showPromotionPicker() {
      promotion.innerHTML = "";
      for (const letter of PROMOTION_PIECES) {
        const image = document.createElement("img");
        image.src = pieceImage(playerColour + letter.toUpperCase());
        image.onclick = function () {
          choosePromotion(letter);
        };
        promotion.appendChild(image);
      }
      promotion.style.display = "block";
      status.textContent = "Pick a piece to promote to";
    }

    function choosePromotion(letter) {
      game.move({from: promotionMove.from, to: promotionMove.to, promotion: letter});
      board.position(game.fen());
      promotion.style.display = "none";
      const uci = promotionMove.from + promotionMove.to + letter;
      promotionMove = null;
      playerMoved(uci);
    }

    function playerMoved(uci) {
      moves.push(uci);
      pressClock();
      highlightLastMove(uci);
      askFelis();
    }

    async function askFelis() {
      if (game.game_over()) {
        clockRunning = false;
        status.textContent = gameOverText();
        return;
      }
      thinking = true;
      status.textContent = "Felis is thinking...";
      const askedInGame = gameNumber;

      // with a clock, Felis gets both clocks and decides its own time
      const request = {moves: moves, seconds: seconds};
      if (clocks !== null) {
        request.white_clock = timeLeft("w") / 1000;
        request.black_clock = timeLeft("b") / 1000;
      }

      let data = null;
      try {
        const response = await fetch("/move", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify(request),
        });
        data = await response.json();
      } catch (error) {
        data = null;
      }

      // a new game was started while Felis was thinking: ignore this answer
      if (askedInGame !== gameNumber) {
        return;
      }
      thinking = false;

      if (data === null || !data.move) {
        status.textContent = "Couldn't reach Felis, try New game";
        return;
      }

      game.move({from: data.move.slice(0, 2), to: data.move.slice(2, 4), promotion: data.move[4]});
      moves.push(data.move);
      pressClock();
      board.position(game.fen());
      highlightLastMove(data.move);

      if (game.game_over()) {
        clockRunning = false;
        status.textContent = gameOverText();
      } else {
        status.textContent = "Your move";
      }
    }

    // the squares the last move went from and to glow green, like the pygame GUI
    function highlightLastMove(uci) {
      $("#board .last-move").removeClass("last-move");
      if (uci !== null) {
        findSquare(uci.slice(0, 2)).addClass("last-move");
        findSquare(uci.slice(2, 4)).addClass("last-move");
      }
    }

    function showLegalMoves(square) {
      clearLegalMoves();
      selectedSquare = square;
      const legalMoves = game.moves({square: square, verbose: true});
      for (const legalMove of legalMoves) {
        findSquare(legalMove.to).addClass("legal-move");
      }
    }

    function findSquare(square) {
      return $("#board .square-" + square);
    }

    function clearLegalMoves() {
      selectedSquare = null;
      $("#board .legal-move").removeClass("legal-move");
    }

    function gameOverText() {
      if (game.in_checkmate()) {
        if (game.turn() === playerColour) {
          return "Checkmate, Felis wins";
        } else {
          return "Checkmate, you win!";
        }
      }
      if (game.in_stalemate()) {
        return "Draw by stalemate";
      }
      if (game.in_threefold_repetition()) {
        return "Draw by threefold repetition";
      }
      if (game.insufficient_material()) {
        return "Draw by insufficient material";
      }
      return "Draw by the 50-move rule";
    }

    // takes the time used off the side that just moved, starts the other clock
    // white's first move is free: the clocks only start after it
    function pressClock() {
      if (clocks === null) {
        return;
      }
      const now = Date.now();
      if (moves.length > 1) {
        clocks[clockSide] -= now - clockStart;
      }
      clockStart = now;
      clockSide = game.turn();
    }

    function clockTicking() {
      return clockRunning && moves.length > 0;
    }

    function timeLeft(side) {
      if (clockTicking() && side === clockSide) {
        return clocks[side] - (Date.now() - clockStart);
      }
      return clocks[side];
    }

    function formatClock(milliseconds) {
      const total = Math.floor(Math.max(milliseconds, 0) / 1000);
      return Math.floor(total / 60) + ":" + String(total % 60).padStart(2, "0");
    }

    // runs every 100 ms: redraws the clocks, and ends the game when one runs out
    function updateClocks() {
      const felisClock = document.getElementById("felis-clock");
      const yourClock = document.getElementById("your-clock");
      if (clocks === null) {
        felisClock.style.display = "none";
        yourClock.style.display = "none";
        return;
      }

      if (clockTicking() && timeLeft(clockSide) <= 0) {
        clocks[clockSide] = 0;
        clockRunning = false;
        outOfTime = true;
        // a move Felis is still thinking about gets ignored
        gameNumber += 1;
        promotionMove = null;
        promotion.style.display = "none";
        clearLegalMoves();
        status.textContent = timeoutText(clockSide);
      }

      let felisSide = "w";
      if (playerColour === "w") {
        felisSide = "b";
      }
      felisClock.textContent = "Felis " + formatClock(timeLeft(felisSide));
      yourClock.textContent = "You " + formatClock(timeLeft(playerColour));
      felisClock.classList.toggle("running", clockTicking() && clockSide === felisSide);
      yourClock.classList.toggle("running", clockTicking() && clockSide === playerColour);
      felisClock.style.display = "block";
      yourClock.style.display = "block";
    }

    // running out of time loses, unless the other side can't possibly checkmate, then it's a draw
    function timeoutText(flaggedSide) {
      let otherSide = "w";
      if (flaggedSide === "w") {
        otherSide = "b";
      }
      if (!canCheckmate(otherSide)) {
        return "Draw by timeout vs insufficient material";
      }
      if (flaggedSide === playerColour) {
        return "You ran out of time, Felis wins";
      }
      return "Felis ran out of time, you win!";
    }

    // same check as python-chess's has_insufficient_material: only looks at the pieces
    function canCheckmate(side) {
      const rows = game.fen().split(" ")[0].split("/");
      const mine = [];
      const theirs = [];
      const bishopSquareColours = [];
      let pawnsOrKnights = false;
      for (let rank = 0; rank < 8; rank++) {
        let file = 0;
        for (const letter of rows[rank]) {
          if (letter >= "1" && letter <= "8") {
            file += Number(letter);
            continue;
          }
          const type = letter.toLowerCase();
          let colour = "b";
          if (letter !== type) {
            colour = "w";
          }
          if (colour === side) {
            mine.push(type);
          } else {
            theirs.push(type);
          }
          if (type === "b") {
            bishopSquareColours.push((rank + file) % 2);
          }
          if (type === "p" || type === "n") {
            pawnsOrKnights = true;
          }
          file += 1;
        }
      }

      if (mine.includes("p") || mine.includes("r") || mine.includes("q")) {
        return true;
      }
      // king + knight: only mates if the other side has pieces (not queens) that block their own king
      if (mine.includes("n")) {
        if (mine.length > 2) {
          return true;
        }
        for (const type of theirs) {
          if (type !== "k" && type !== "q") {
            return true;
          }
        }
        return false;
      }
      // bishops all on one square colour can't mate without pawns or knights on the board
      if (mine.includes("b")) {
        const sameColour = !bishopSquareColours.includes(0) || !bishopSquareColours.includes(1);
        if (sameColour && !pawnsOrKnights) {
          return false;
        }
        return true;
      }
      // a lone king
      return false;
    }

    const board = Chessboard("board", {
      position: "start",
      draggable: true,
      pieceTheme: pieceImage,
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd,
    });

    $("#board").on("click", ".square-55d63", function () {
      const square = $(this).attr("data-square");
      if (selectedSquare !== null && $(this).hasClass("legal-move")) {
        tryMove(selectedSquare, square);
        board.position(game.fen());
      }
    });

    // resize the board with the window (it redraws the squares, so put the green back)
    window.addEventListener("resize", function () {
      board.resize();
      clearLegalMoves();
      if (moves.length > 0) {
        highlightLastMove(moves[moves.length - 1]);
      }
    });

    // changing a setting before the first move starts the game again with it
    function settingChanged() {
      // with a clock, Felis uses that instead of the seconds per move, so hide it
      if (document.getElementById("clock").value === "0") {
        document.getElementById("seconds").style.display = "inline-block";
      } else {
        document.getElementById("seconds").style.display = "none";
      }
      if (moves.length === 0) {
        newGame();
      }
    }

    document.getElementById("colour").onchange = settingChanged;
    document.getElementById("seconds").onchange = settingChanged;
    document.getElementById("clock").onchange = settingChanged;
    document.getElementById("new-game").onclick = newGame;
    settingChanged();
    setInterval(updateClocks, 100);
  </script>
</body>
</html>
